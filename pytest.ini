[pytest]
# Scope collection to tests/. batch_encoding/test_encode.py is named like a pytest file but
# is a CLI smoke test — `python batch_encoding/test_encode.py <clip.mp4>` — and it imports
# torch at module level. Without this, a clean checkout that installed only
# requirements.txt (which is deliberately torch-free) fails collection before running
# anything. Run it directly on the GPU box instead.
testpaths = tests

# The repo convention is tests/*_test.py; the default pattern already catches both, and
# naming it here keeps the intent visible.
python_files = *_test.py test_*.py
